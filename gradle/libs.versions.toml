[versions]
# For renovate to work right, every version referenced here MUST have a coresponding dependency in the catalog, which is used to detect updates for it

kotlin = "2.4.10"
ktor = "3.5.1"
logback = "1.6.0"
caffeine = "3.2.4"
commonsIo = "2.22.0"
schemaKenerator = "2.7.2"
kotlinxSerializationJson = "1.11.0"
flexmark = "0.64.8"
coroutines = "1.11.0"
mcpSdk = "0.13.0"
gradleToolingApi = "9.7.1" # renovate: ignoreUnstable=false
buildconfig = "6.0.10"
vanniktechPublish = "0.37.0"
jsoup = "1.22.2"
koin = "4.2.2"
mockk = "1.14.11"
slf4j = "2.0.18"
guava = "33.6.0-jre"
junit-jupiter = "6.1.2"
jetbrains-compose = "1.11.1"
agp9 = "9.3.1"
androidxCompose = "1.11.4"
androidxActivityCompose = "1.13.0"
lucene = "10.5.0"
shadow = "9.6.1"
treesitter = "0.26.6"
treesitter-java = "0.23.5"
treesitter-kotlin = "0.3.8.1"
ort = "83.0.1"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-power-assert = { id = "org.jetbrains.kotlin.plugin.power-assert", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish.base", version.ref = "vanniktechPublish" }

[libraries]
gradle-tooling-api = { module = "org.gradle:gradle-tooling-api", version.ref = "gradleToolingApi" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
commons-io = { module = "commons-io:commons-io", version.ref = "commonsIo" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
